name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same PR cancels the run it supersedes; main pushes always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/zigzag
      DIRECT_URL: postgresql://ci:ci@localhost:5432/zigzag
      NEXTAUTH_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-secret
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3070
      E2E_EMAIL: e2e@zigzag.test
      E2E_PASSWORD: e2e-Password123!
      # 333px variants of the mobile redesign specs run only for PRs into main and pushes to main.
      E2E_ALL_WIDTHS: ${{ (github.event_name == 'push' || github.base_ref == 'main') && '1' || '0' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zigzag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zigzag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage gate)
        run: npm test -- --runInBand --coverage

      # The IDOR cross-tenant tests already run in the unit test step above.
      - name: IDOR audit matrix coverage gate
        run: npm run check:idor-coverage

      # Fails when a PR adds a migration that can lose data without a `-- data-loss-ok:` line.
      - name: Migration safety (no destructive SQL)
        if: github.event_name == 'pull_request'
        run: npm run check:migrations

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run seed

      - name: Create E2E user
        run: node scripts/ci-create-e2e-user.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Visual baselines are darwin-only today; run chromium + mobile critically.
      # Update linux snapshots with: npm run test:e2e:visual:update
      # No separate Build step: Playwright's webServer runs `npm run build` first, so a broken build fails here.
      - name: E2E (critical path, includes axe-core a11y gate)
        run: npx playwright test --project=chromium --project=mobile-chrome
